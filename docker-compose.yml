# Only Connect — full stack. All credentials and ports come from the root .env file (docker compose reads it
# automatically; edit it there — .env.example mirrors it). Every variable has the documented default below,
# so a fresh clone starts with `docker compose up --build` even before .env exists.
#
#   browser ──:${APP_PORT}──> client (nginx) ──/api, /socket.io──> api (Node 22) ──> db (Postgres 16)
#                                                                                └──> minio (S3 bucket "media")

name: only-connect

# Container logs are rotated (the default json-file driver keeps them forever).
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      # NOTE: Postgres applies POSTGRES_PASSWORD only when the data volume is created (first boot). To change
      # it later see README "Changing credentials".
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12346789}
      POSTGRES_DB: ${POSTGRES_DB:-onlyconnect}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    # MinIO's own Docker Hub / quay.io images are no longer publicly pullable; alpine/minio is the
    # community build of the same release tag (AGPLv3). The api creates the bucket on boot.
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    <<: *logging
    # The image runs as uid 100, but a fresh named volume is created root-owned, so the server could not
    # write to /data. Running as root inside the container keeps "docker compose up" zero-step.
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-12346789}
    volumes:
      - miniodata:/data
    ports:
      # Optional web console (login with MINIO_ROOT_USER / MINIO_ROOT_PASSWORD). Bound to the loopback
      # interface by default: docker's published ports bypass the host firewall, and the console holds the
      # root credentials of the bucket. Set MINIO_CONSOLE_BIND=0.0.0.0 to publish it on every interface.
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    <<: *logging
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-12346789}@db:5432/${POSTGRES_DB:-onlyconnect}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-12346789}
      S3_BUCKET: ${MINIO_BUCKET:-media}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-12346789}
      JWT_SECRET: ${JWT_SECRET:-12346789}
      # Extra browser origins allowed to use the API (comma separated); same-origin is always allowed.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    <<: *logging
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

volumes:
  pgdata:
  miniodata:
