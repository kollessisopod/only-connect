<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img" aria-label="Lion hieroglyph">
  <title>Lion hieroglyph</title>
  <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- nose, forehead, ear, back line to the rump, tail curling up and over the haunch -->
    <path d="M12,47 C12,40 20,32 30,28 C36,25 42,25 48,28 C47,19 60,19 59,30 C72,31 90,36 100,44 C118,52 136,54 150,50 C158,34 176,30 186,40 C194,50 184,62 172,58 C166,55 166,48 172,46"/>
    <!-- mane lobe hanging behind the head, its tip running down into the back of the foreleg -->
    <path d="M100,44 C108,54 104,66 94,72 C86,78 84,90 86,100"/>
    <!-- muzzle, chin, cheek, chest, then the foreleg stretched out flat along the ground -->
    <path d="M12,47 C11,53 14,61 22,64 C31,67 40,64 44,60 C50,66 56,76 58,86 C58,90 54,90 48,90 L20,90 C12,90 12,102 20,102 L86,102"/>
    <!-- ground line under the belly and the rounded haunch rising to the rump -->
    <path d="M86,102 L178,102 C188,102 192,94 190,84 C188,70 176,56 150,50"/>
    <!-- inner thigh of the hind leg -->
    <path d="M164,62 C174,72 180,86 178,100"/>
    <circle cx="28" cy="44" r="2.5"/>
  </g>
</svg>
