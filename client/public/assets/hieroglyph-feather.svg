<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img" aria-label="Feather of Ma'at hieroglyph">
  <title>Feather of Ma'at hieroglyph</title>
  <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- vane: broad on the left of the shaft with two splits in its edge, narrow on the right, curving up to the tip -->
    <path d="M86,104 C76,98 70,86 68,74 L80,70 C68,62 68,48 74,36 L84,36 C80,24 98,8 118,12 C126,30 118,60 104,84 C100,92 94,100 86,104 Z"/>
    <!-- shaft (rachis) with the bare quill below the vane -->
    <path d="M84,116 L86,104 C90,80 100,46 118,12"/>
    <!-- barbs sweeping up and out from the shaft -->
    <path d="M92,88 C86,86 80,82 76,76"/>
    <path d="M97,70 C90,68 84,62 80,54"/>
    <path d="M104,52 C98,50 92,44 90,36"/>
    <path d="M111,34 C106,32 102,26 100,20"/>
  </g>
</svg>
